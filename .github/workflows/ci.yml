name: Local demonstrator verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_ENABLED: "false"
      AGENT_MODE: disabled
      BRIDGE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: python3 scripts/check_secrets.py
      - run: make bootstrap
      - run: make up seed
      - run: make verify
      - if: always()
        run: docker compose logs --tail 60 api worker keyple
      - if: always()
        run: make stop
